model_list:
  - model_name: medguard-answer
    litellm_params:
      model: ollama_chat/qwen2.5:3b
      api_base: http://host.docker.internal:11434
      timeout: 120
      num_ctx: 8192
    model_info:
      mode: chat
      supported_environments: [development, staging, production]

