# Legacy quota-limited development profile retained for backward-compatible
# architecture tests and local MedGemma reviewer experiments.
#
# V27.1 runtime does NOT use this file. See config.gemini-v27-free.yaml.
model_list:
  - model_name: medguard-answer
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 45
    model_info:
      mode: chat
      supports_web_search: true
      supported_environments: [development, staging]

  - model_name: medguard-verifier
    litellm_params:
      model: ollama_chat/medgemma1.5:4b
      api_base: http://host.docker.internal:11434
      timeout: 180
      num_ctx: 8192
    model_info:
      mode: chat
      supports_web_search: false
      supported_environments: [development, staging]

  - model_name: medguard-clinical-answer
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 45
    model_info:
      mode: chat
      supports_web_search: true
      supported_environments: [development, staging]

  - model_name: medguard-clinical-verifier
    litellm_params:
      model: ollama_chat/medgemma1.5:4b
      api_base: http://host.docker.internal:11434
      timeout: 180
      num_ctx: 8192
    model_info:
      mode: chat
      supports_web_search: false
      supported_environments: [development, staging]

  - model_name: medguard-pharma-answer
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 45
    model_info:
      mode: chat
      supports_web_search: true
      supported_environments: [development, staging]

  - model_name: medguard-pharma-verifier
    litellm_params:
      model: ollama_chat/medgemma1.5:4b
      api_base: http://host.docker.internal:11434
      timeout: 180
      num_ctx: 8192
    model_info:
      mode: chat
      supports_web_search: false
      supported_environments: [development, staging]

litellm_settings:
  drop_params: true
  telemetry: false
  request_timeout: 180
  num_retries: 0
  allowed_fails: 2
  cooldown_time: 30
  success_callback: [prometheus]
  failure_callback: [prometheus]
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    mode: default_off
    ttl: 300
  default_key_generate_params:
    models:
      - medguard-answer
      - medguard-verifier
      - medguard-clinical-answer
      - medguard-clinical-verifier
      - medguard-pharma-answer
      - medguard-pharma-verifier
    budget_duration: 30d
    rpm_limit: 10
    tpm_limit: 100000
    max_parallel_requests: 1

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  num_retries: 0
  timeout: 180
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  background_health_checks: false
