# MedGuard V27.1 stable free development profile.
#
# Mandatory patient-visible path:
#   Writer   -> Gemini 3.5 Flash-Lite
#   Reviewer -> Gemini 3.5 Flash-Lite
#
# Why not Gemini 3.8 Flash here?
# The free-tier 3.8 quota is too small to serve as the mandatory Writer path for
# repeated development/benchmark traffic. A quota-exhausted Writer forces the
# whole response into deterministic fallback, which is worse than using the
# lower-cost stable model with MedGuard's strong clinical contract + Jev gates.
#
# NOTE: Writer and Reviewer remain separate calls and separate roles, but this
# FREE profile does not provide model-family independence. Use the quality/paid
# profile when independent model judgment is required.
#
# DEVELOPMENT/STAGING ONLY. Free-tier prompts may be used by Google to improve
# its products; use de-identified test data only. Deterministic MedGuard safety
# gates remain authoritative.
#
# IMPORTANT V27 invariant: Reviewer aliases are never Writer fallbacks. If a
# Writer/provider call fails, MedGuard must fail closed to its deterministic
# safety fallback instead of turning a Reviewer into a second response author.

model_list:
  - model_name: medguard-answer
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      timeout: 60
    model_info:
      mode: chat
      role: patient_response_writer
      supports_web_search: false
      supported_environments: [development, staging]

  - model_name: medguard-verifier
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      timeout: 60
    model_info:
      mode: chat
      role: non_authoring_reviewer
      supports_web_search: false
      supported_environments: [development, staging]

  - model_name: medguard-clinical-answer
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      timeout: 60
    model_info:
      mode: chat
      role: clinical_patient_response_writer
      supports_web_search: false
      supported_environments: [development, staging]

  - model_name: medguard-clinical-verifier
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      timeout: 60
    model_info:
      mode: chat
      role: clinical_non_authoring_reviewer
      supports_web_search: false
      supported_environments: [development, staging]

  - model_name: medguard-pharma-answer
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      timeout: 60
    model_info:
      mode: chat
      role: medication_patient_response_writer
      supports_web_search: false
      supported_environments: [development, staging]

  - model_name: medguard-pharma-verifier
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      timeout: 60
    model_info:
      mode: chat
      role: medication_non_authoring_reviewer
      supports_web_search: false
      supported_environments: [development, staging]

litellm_settings:
  drop_params: true
  telemetry: false
  request_timeout: 60
  num_retries: 1
  allowed_fails: 2
  cooldown_time: 30
  success_callback: [prometheus]
  failure_callback: [prometheus]
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    mode: default_off
    ttl: 300
  default_key_generate_params:
    models:
      - medguard-answer
      - medguard-verifier
      - medguard-clinical-answer
      - medguard-clinical-verifier
      - medguard-pharma-answer
      - medguard-pharma-verifier
    budget_duration: 30d
    rpm_limit: 8
    tpm_limit: 80000
    max_parallel_requests: 1

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  num_retries: 1
  timeout: 60
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

# No cross-role fallbacks here. Provider failure is handled by MedGuard's
# deterministic fail-closed path, not by promoting a Reviewer to Writer.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  background_health_checks: false
