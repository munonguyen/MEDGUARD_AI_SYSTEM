global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: litellm
    metrics_path: /metrics
    bearer_token: replace-with-random-master-key
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: medguard-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
