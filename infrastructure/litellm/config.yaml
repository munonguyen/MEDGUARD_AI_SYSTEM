model_list:
  - model_name: medguard-answer
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
      timeout: 4
      rpm: 60
      tpm: 500000
    model_info:
      mode: chat
      supported_environments: [development, staging, production]

  - model_name: medguard-verifier
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
      timeout: 4
      rpm: 60
      tpm: 500000
    model_info:
      mode: chat
      supported_environments: [development, staging, production]

  - model_name: medguard-clinical-answer
    litellm_params:
