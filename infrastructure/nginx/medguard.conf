# MedGuard reference ingress configuration.
#
# This proxy is deliberately infrastructure-only. Clinical triage, safety floors,
# consent and release gates stay inside the application. Prometheus should scrape
# the API service directly on the private network; /metrics is not exposed here.

upstream medguard_api {
    server medguard-api:8000;
    keepalive 32;
}

server {
    listen 8080 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 12m;

    # Correlate ingress and application telemetry without forwarding patient data.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 75s;

    # Metrics remain private. Prometheus/Grafana are support-plane components and
    # must never be reachable through the patient-facing ingress.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://medguard_api;
    }
}
