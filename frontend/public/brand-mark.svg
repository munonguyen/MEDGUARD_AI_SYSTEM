<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MedGuard AI">
  <defs>
    <!-- Master Medical Gradient: Oceanic Blue -> Clinical Teal -> Emerald -->
    <linearGradient id="mgShieldGrad" x1="10" y1="5" x2="54" y2="59" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#056143" />
    </linearGradient>

    <!-- AI Neural Orbit Glow -->
    <linearGradient id="mgOrbitGrad" x1="16" y1="13" x2="48" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="mgSubtleShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Outer Protective Shield (Deterministic Clinical Safety Barrier) -->
  <path d="M32 5.5C23.2 6.8 14.8 10.8 10.8 15.2C10.8 30.5 14.8 45.8 32 58.5C49.2 45.8 53.2 30.5 53.2 15.2C49.2 10.8 40.8 6.8 32 5.5Z"
        fill="url(#mgShieldGrad)"
        filter="url(#mgSubtleShadow)"/>

  <!-- Inner Precision Contour -->
  <path d="M32 9.5C24.5 10.6 17.5 14 14.5 17.5C14.5 30 17.5 42.5 32 53C46.5 42.5 49.5 30 49.5 17.5C46.5 14 39.5 10.6 32 9.5Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.2"
        stroke-opacity="0.24"
        stroke-linejoin="round"/>

  <!-- AI Continuous Intelligence Orbit Ring -->
  <circle cx="32" cy="29" r="16"
          stroke="url(#mgOrbitGrad)"
          stroke-width="1.2"
          stroke-dasharray="2.5 2.5"
          opacity="0.75" />

  <!-- Symmetrical AI Neural Network Data Links -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Orthogonal AI Data Axes -->
    <line x1="32" y1="12" x2="32" y2="18.5" stroke-width="1.6"/>
    <line x1="32" y1="39.5" x2="32" y2="47" stroke-width="1.6"/>
    <line x1="15" y1="29" x2="22" y2="29" stroke-width="1.6"/>
    <line x1="42" y1="29" x2="49" y2="29" stroke-width="1.6"/>

    <!-- Diagonal Data Rays connecting Nodes to Cross -->
    <line x1="20" y1="18.5" x2="25.5" y2="23" stroke-width="1.3" opacity="0.75"/>
    <line x1="44" y1="18.5" x2="38.5" y2="23" stroke-width="1.3" opacity="0.75"/>
    <line x1="20" y1="39.5" x2="25.5" y2="35" stroke-width="1.3" opacity="0.75"/>
    <line x1="44" y1="39.5" x2="38.5" y2="35" stroke-width="1.3" opacity="0.75"/>
  </g>

  <!-- 4 Symmetrical AI Neural Processing Nodes (Answer, Verifier, Triage, Safety) -->
  <circle cx="20" cy="18.5" r="2.4" fill="#FFFFFF"/>
  <circle cx="44" cy="18.5" r="2.4" fill="#FFFFFF"/>
  <circle cx="20" cy="39.5" r="2.4" fill="#FFFFFF"/>
  <circle cx="44" cy="39.5" r="2.4" fill="#FFFFFF"/>

  <!-- Core Medical Cross (Human Centric Health & Care) -->
  <path d="M28.5 20C28.5 19.17 29.17 18.5 30 18.5H34C34.83 18.5 35.5 19.17 35.5 20V25H40.5C41.33 25 42 25.67 42 26.5V31.5C42 32.33 41.33 33 40.5 33H35.5V38C35.5 38.83 34.83 39.5 34 39.5H30C29.17 39.5 28.5 38.83 28.5 38V33H23.5C22.67 33 22 32.33 22 31.5V26.5C22 25.67 22.67 25 23.5 25H28.5V20Z"
        fill="#FFFFFF"/>
</svg>
