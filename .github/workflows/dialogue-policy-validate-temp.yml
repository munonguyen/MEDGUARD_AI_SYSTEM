name: Validate Clinical Dialogue Policy Candidate

on:
  push:
    branches:
      - feature/clinical-dialogue-policy

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v7
        with:
          ref: feature/clinical-dialogue-policy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply dialogue policy integration patch
        if: ${{ github.event.head_commit.message != 'feat: integrate clinical dialogue policy' }}
        run: python scripts/patch_dialogue_policy_temp.py

      - name: Compile application
        run: python -m compileall -q app

      - name: Run question policy unit tests
        run: pytest app/tests/test_question_policy.py -q

      - name: Run dialogue policy integration tests
        run: pytest app/tests/test_dialogue_policy_integration.py -q

      - name: Run clinical episode regressions
        run: pytest app/tests/test_clinical_episode_orchestration.py -q

      - name: Run full candidate backend suite
        run: pytest -q --ignore=app/tests/test_v10_freeze_guard.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Start MedGuard
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/medguard-dialogue.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/medguard-dialogue.log
          exit 1

      - name: Run real Playwright UI smoke
        working-directory: frontend
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_PATH="$CHROME_BIN" MEDGUARD_UI_URL=http://127.0.0.1:8000 npm run test:ui

      - name: Commit validated integration
        if: ${{ github.event.head_commit.message != 'feat: integrate clinical dialogue policy' }}
        run: |
          git config user.name "medguard-ci-bot"
          git config user.email "medguard-ci-bot@users.noreply.github.com"
          git add app/services/triage.py app/services/answering.py
          git diff --cached --check
          git commit -m "feat: integrate clinical dialogue policy"
          git push origin HEAD:feature/clinical-dialogue-policy

      - name: Show backend log
        if: always()
        run: tail -n 200 /tmp/medguard-dialogue.log || true
