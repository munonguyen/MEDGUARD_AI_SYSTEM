name: V12 Agent First Temp

on:
  push:
    branches:
      - feature/agent-first-clinical-pipeline
    paths:
      - scripts/apply_agent_first_v12_temp.py
      - scripts/fix_v12_harness_locator_temp.py
      - scripts/fix_v12_iteration_guard_temp.py
      - scripts/fix_v12_contract_test_temp.py
      - .github/workflows/v12-agent-first-temp.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Repair V12 harness locator
        run: python scripts/fix_v12_harness_locator_temp.py

      - name: Repair bounded review iteration guard
        run: python scripts/fix_v12_iteration_guard_temp.py

      - name: Repair V12 contract regression assertion
        run: python scripts/fix_v12_contract_test_temp.py

      - name: Apply V12 agent-first patch
        run: python scripts/apply_agent_first_v12_temp.py

      - name: Compile application
        run: python -m compileall -q app scripts training

      - name: Run targeted V12 tests
        run: pytest -q app/tests/test_agent_first_clinical_v12.py app/tests/test_answer_agents.py app/tests/test_output_quality_governance.py

      - name: Run full backend regression
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify clean patch
        run: git diff --check

      - name: Commit validated V12 source
        run: |
          git config user.name "MedGuard CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/core/config.py app/services/clinical_agent_contract.py app/services/answer_agents.py app/services/agent_graph.py app/services/chat.py app/services/output_quality_verifier.py app/tests/test_agent_first_clinical_v12.py app/tests/test_output_quality_governance.py
          git commit -m "feat: make clinical response generation agent-first"
          git push origin HEAD:feature/agent-first-clinical-pipeline
