name: V13 Structured Routing Apply

on:
  push:
    branches:
      - feature/v13-structured-clinical-routing
    paths:
      - scripts/apply_v13_structured_routing.py
      - .github/workflows/v13-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply V13 orchestration patch
        run: python scripts/apply_v13_structured_routing.py

      - name: Compile
        run: python -m compileall -q app scripts

      - name: Run V13 targeted gates
        run: pytest -q app/tests/test_v13_structured_routing.py app/tests/test_v13_human_behavior_benchmark.py

      - name: Verify V10 provenance
        run: python blind_v10/freeze_guard.py --verify

      - name: Run full backend suite
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit validated source patch
        run: |
          if git diff --quiet -- app/services/chat.py; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/chat.py
          git commit -m "V13: separate clinical task routing from severity"
          git push origin HEAD:feature/v13-structured-clinical-routing
