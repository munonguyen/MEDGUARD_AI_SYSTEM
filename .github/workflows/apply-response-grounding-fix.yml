name: Apply response grounding repair

on:
  push:
    branches: [fix/response-grounding-p0]
    paths:
      - .github/workflows/apply-response-grounding-fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/response-grounding-p0
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/apply_response_grounding_p0_patch.py
      - run: python -m compileall -q app scripts training
      - run: pytest -q app/tests/test_response_grounding_p0.py app/tests/test_medical_response_quality_benchmark.py
      - run: pytest -q
      - name: Measure quality benchmark
        run: |
          set +e
          python scripts/evaluate_medical_response_quality.py --no-report
          echo "quality_exit_code=$?"
          exit 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/semantic_abstraction_lattice.py app/services/answering.py app/tests/test_response_grounding_p0.py
          git commit -m "fix(response-grounding): prevent cross-symptom contamination"
          git push origin HEAD:fix/response-grounding-p0
