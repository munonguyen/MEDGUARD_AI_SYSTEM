name: Validate hypothetical fact scope repair

on:
  push:
    branches: [fix/response-grounding-p0]
    paths:
      - .github/workflows/apply-response-grounding-fix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/response-grounding-p0
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/apply_hypothetical_scope_fix.py
      - run: python -m compileall -q app scripts training
      - name: Targeted grounding and benchmark regressions
        run: pytest -q app/tests/test_response_grounding_p0.py app/tests/test_medical_response_quality_benchmark.py
      - name: Hard-user compatibility
        run: python scripts/benchmark_chat_hard.py
      - name: Full backend regression
        run: pytest -q
      - name: Full 40-case response-quality gate
        run: python scripts/evaluate_medical_response_quality.py --no-report
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend production build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Commit validated question-scope repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/clinical_text.py app/tests/test_response_grounding_p0.py
          git commit -m "fix(clinical-text): keep hypothetical questions out of patient facts"
          git push origin HEAD:fix/response-grounding-p0
