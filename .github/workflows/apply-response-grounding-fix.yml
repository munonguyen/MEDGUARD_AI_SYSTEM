name: Diagnose MRQ-030 evaluator

on:
  push:
    branches: [fix/response-grounding-p0]
    paths:
      - .github/workflows/apply-response-grounding-fix.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/response-grounding-p0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/diagnose_mrq030.py
