name: Temporary UI Smoke

on:
  push:
    branches:
      - fix/clinical-episode-orchestration

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Start MedGuard
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/medguard-ui.log 2>&1 &
          echo $! > /tmp/medguard-ui.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/medguard-ui.log
          exit 1

      - name: Print diagnostic chat responses
        run: |
          python - <<'PY'
          import json, uuid, httpx

          base = "http://127.0.0.1:8000"
          common = {
              "X-API-Key": "demo-key",
              "X-Tenant-Id": "tenant-demo",
              "X-Consent-Token": "consent-valid-ui",
          }

          def chat(cid, messages, key):
              headers = {**common, "Idempotency-Key": key}
              response = httpx.post(
                  f"{base}/v1/chat",
                  headers=headers,
                  json={
                      "conversation_id": cid,
                      "messages": messages,
                      "context": {
                          "patient_ref": None,
                          "age": None,
                          "sex": None,
                          "current_medications": [],
                          "allergies": [],
                          "conditions": [],
                          "last_result": None,
                      },
                      "intent_hint": "auto",
                      "locale": "vi-VN",
                  },
                  timeout=20,
              )
              response.raise_for_status()
              data = response.json()
              print("\n===", key, "===")
              print(json.dumps({
                  "intent": data.get("intent"),
                  "reply": data.get("reply"),
                  "urgency": (data.get("result") or {}).get("urgency"),
                  "specialty": ((data.get("result") or {}).get("recommended_specialty") or {}).get("label"),
                  "answer_title": (data.get("answer") or {}).get("title"),
                  "answer_summary": (data.get("answer") or {}).get("summary"),
                  "narrative": (data.get("answer") or {}).get("narrative"),
                  "next_steps": (data.get("answer") or {}).get("next_steps"),
                  "questions": (data.get("answer") or {}).get("questions"),
                  "safety_notes": (data.get("answer") or {}).get("safety_notes"),
                  "verification_status": data.get("verification_status"),
                  "knowledge_approval": data.get("knowledge_approval"),
              }, ensure_ascii=False, indent=2))
              return data

          cid = f"diag-abd-{uuid.uuid4()}"
          messages = [{"role":"user","content":"Tôi đang cảm thấy bụng cứ cồn cào, sốt ruột không rõ lắm."}]
          first = chat(cid, messages, "diag-abdominal-1")
          messages += [{"role":"assistant","content": first.get("reply", "")}, {"role":"user","content":"Cảm giác nó cứ khó chịu, buồn nôn lắm."}]
          second = chat(cid, messages, "diag-abdominal-2")

          cid2 = f"diag-switch-{uuid.uuid4()}"
          sequence = [
              "Tôi hơi đau lưng sau khi ngồi máy tính cả ngày",
              "Tôi chỉ đau ở vùng thắt lưng, không có đau lan hay tê chân.",
              "tôi đang rất đau bụng và buồn nôn",
              "Cơn đau của tôi tập trung ở vùng trên rốn.",
              "Cơn đau thường xuất hiện hoặc tăng lên khi đói",
              "Cơn đau có kèm theo nóng rát và ợ chua",
          ]
          history = []
          for index, text in enumerate(sequence, start=1):
              history.append({"role":"user","content":text})
              data = chat(cid2, history, f"diag-switch-{index}")
              history.append({"role":"assistant","content":data.get("reply", "")})
          PY

      - name: Run Playwright UI smoke
        continue-on-error: true
        working-directory: frontend
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium executable found"
            exit 1
          fi
          echo "Using browser: $CHROME_BIN"
          CHROME_PATH="$CHROME_BIN" MEDGUARD_UI_URL=http://127.0.0.1:8000 npm run test:ui

      - name: Print backend log
        if: always()
        run: cat /tmp/medguard-ui.log || true
