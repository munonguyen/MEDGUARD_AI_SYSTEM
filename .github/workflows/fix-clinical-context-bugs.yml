name: Patch and Validate Clinical Context Bugs

on:
  push:
    branches:
      - fix/clinical-episode-orchestration
    paths:
      - .github/workflows/fix-clinical-context-bugs.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply targeted fixes
        run: python scripts/patch_clinical_context_bugs.py
      - name: Compile patched Python
        run: python -m py_compile app/services/chat.py app/services/triage.py app/knowledge/loader.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run targeted clinical regression
        run: python -m pytest -q app/tests/test_clinical_episode_orchestration.py app/tests/test_chat.py
      - name: Run full backend regression
        run: python -m pytest -q
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Start MedGuard for UI test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/medguard-ui.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/v1/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/medguard-ui.log
          exit 1
      - name: Run Playwright UI smoke
        working-directory: frontend
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_PATH="$CHROME_BIN" MEDGUARD_UI_URL=http://127.0.0.1:8000 npm run test:ui
      - name: Commit validated fixes
        run: |
          git config user.name "MedGuard CI"
          git config user.email "actions@github.com"
          git add app/services/chat.py app/knowledge/loader.py app/services/triage.py app/tests/test_clinical_episode_orchestration.py
          git commit -m "fix: isolate clinical episodes and respect negation"
          git push origin HEAD:fix/clinical-episode-orchestration
