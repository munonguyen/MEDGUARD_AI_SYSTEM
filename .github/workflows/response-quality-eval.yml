name: Response Quality Evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  response-quality:
    name: Medical response quality (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify V10 provenance first
        run: python blind_v10/freeze_guard.py --verify

      - name: Run 40-case response-quality benchmark
        run: |
          set +e
          python scripts/evaluate_medical_response_quality.py
          code=$?
          echo "benchmark_exit_code=$code"
          exit 0

      - name: Summarize quality dimensions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('datasets/DS-MEDICAL-RESPONSE-QUALITY/eval_report.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          results = report['results']
          dims = sorted(results[0]['dimensions']) if results else []
          print(f"QUALITY_SUMMARY average={report['average_score']}/{report['maximum_score']} critical_failures={report['critical_failures']} subthreshold={report['subthreshold_cases']} p95_ms={report['p95_latency_ms']} gate={report['gate_passed']}")
          for dim in dims:
              values = [r['dimensions'][dim] for r in results]
              avg = sum(values) / len(values)
              perfect = sum(v == 2 for v in values)
              zero = sum(v == 0 for v in values)
              print(f"DIM {dim} avg={avg:.3f}/2 pct={avg/2*100:.1f} perfect={perfect}/{len(values)} zero={zero}")
          print('LOWEST_CASES')
          for r in sorted(results, key=lambda x: (x['total_score'], x['case_id']))[:10]:
              print(f"{r['case_id']} category={r['category']} score={r['total_score']}/14 urgency={r.get('urgency')} intent={r.get('intent')} critical_failure={r['critical_failure']} dims={r['dimensions']}")
          PY

      - name: Inspect critical and low-quality patient outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from unittest.mock import patch
          from fastapi.testclient import TestClient
          from app.main import app

          dataset = json.loads(Path('datasets/DS-MEDICAL-RESPONSE-QUALITY/dataset.json').read_text(encoding='utf-8'))
          wanted = {'MRQ-026', 'MRQ-030', 'MRQ-033'}
          cases = {c['case_id']: c for c in dataset['cases'] if c['case_id'] in wanted}
          client = TestClient(app)
          with patch('app.services.chat.background_agent_runner.submit', return_value=False), patch('app.services.chat.active_learning_store.capture_case', return_value=None):
              for case_id in sorted(wanted):
                  case = cases[case_id]
                  response = client.post(
                      '/v1/chat',
                      headers={
                          'X-API-Key': 'demo-key',
                          'X-Tenant-Id': 'tenant-demo',
                          'X-Consent-Token': 'consent-quality-inspection',
                          'Idempotency-Key': f'inspect-{case_id}',
                      },
                      json={'conversation_id': f'inspect-{case_id}', 'messages': [{'role': 'user', 'content': case['prompt']}]},
                  )
                  body = response.json()
                  answer = body.get('answer') or {}
                  result = body.get('result') or {}
                  print(f"CASE {case_id}")
                  print(json.dumps({
                      'prompt': case['prompt'],
                      'intent': body.get('intent'),
                      'urgency': result.get('urgency'),
                      'specialty': result.get('recommended_specialty'),
                      'summary': answer.get('summary'),
                      'next_steps': answer.get('next_steps'),
                      'safety_notes': answer.get('safety_notes'),
                      'questions': answer.get('questions'),
                      'display_questions': answer.get('display_questions'),
                  }, ensure_ascii=False))
          PY
