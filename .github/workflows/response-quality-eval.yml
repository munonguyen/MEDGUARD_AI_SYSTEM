name: Response Quality Evaluation

on:
  pull_request:

permissions:
  contents: read

jobs:
  response-quality:
    name: Medical response quality (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify V10 provenance first
        run: python blind_v10/freeze_guard.py --verify

      - name: Run 40-case response-quality benchmark
        run: |
          set +e
          python scripts/evaluate_medical_response_quality.py --no-report
          code=$?
          echo "benchmark_exit_code=$code"
          exit 0
