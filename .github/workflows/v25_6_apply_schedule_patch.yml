name: V25.6 Apply Schedule Routing Patch

on:
  push:
    branches:
      - feature/v25-clinical-contextual-reasoning
    paths:
      - .github/workflows/v25_6_apply_schedule_patch.yml
      - app/services/schedule_chat.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/v25-clinical-contextual-reasoning
          fetch-depth: 0

      - name: Patch chat orchestration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/services/chat.py")
          text = path.read_text(encoding="utf-8")

          import_needle = "from app.services.schedules import medication_schedule_store\n"
          import_replacement = import_needle + "from app.services.schedule_chat import execute_schedule_chat_command, is_schedule_chat_command\n"
          if "from app.services.schedule_chat import" not in text:
              if import_needle not in text:
                  raise SystemExit("schedule import anchor not found")
              text = text.replace(import_needle, import_replacement, 1)

          detect_needle = '''    if payload.intent_hint != "auto":\n        return payload.intent_hint\n\n    if "#lichthuoc" in normalized_text:\n        return "schedule"\n'''
          detect_replacement = '''    if payload.intent_hint != "auto":\n        return payload.intent_hint\n\n    # V25.6: explicit schedule/card workflow language is resolved before\n    # clinical scoring so "uống thuốc" inside a reminder request cannot be\n    # misread as evidence of an acute ingestion.\n    if is_schedule_chat_command(normalized_text):\n        return "schedule"\n\n    if "#lichthuoc" in normalized_text:\n        return "schedule"\n'''
          if "if is_schedule_chat_command(normalized_text):" not in text:
              if detect_needle not in text:
                  raise SystemExit("intent detection anchor not found")
              text = text.replace(detect_needle, detect_replacement, 1)

          start_marker = '    if intent == "schedule":\n'
          end_marker = '\n    execution_patient_ref ='
          orchestrate_start = text.find("def orchestrate_chat(")
          start = text.find(start_marker, orchestrate_start)
          end = text.find(end_marker, start)
          if orchestrate_start < 0 or start < 0 or end < 0:
              raise SystemExit("schedule branch anchors not found")
          replacement = '''    if intent == "schedule":\n        command = execute_schedule_chat_command(\n            text=latest_text,\n            tenant_id=ctx.tenant_id,\n            patient_ref=patient_ref,\n        )\n        return _response(\n            payload,\n            ctx,\n            status=command.status,\n            intent=intent,\n            reply=command.reply,\n            required_fields=command.required_fields,\n            extracted=command.extracted,\n            result=command.result,\n        )\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate targeted schedule behavior
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q app
          pytest -q app/tests/test_v25_schedule_card_crud.py app/tests/test_chat_history_schedule_product.py

      - name: Commit source patch and remove temporary workflow
        run: |
          git config user.name "medguard-ci"
          git config user.email "medguard-ci@users.noreply.github.com"
          git add app/services/chat.py
          git rm .github/workflows/v25_6_apply_schedule_patch.yml
          git commit -m "V25.6 route stateful medication card CRUD before clinical triage"
          git push origin HEAD:feature/v25-clinical-contextual-reasoning
