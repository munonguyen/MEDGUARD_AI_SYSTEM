worker_processes auto;
# Nginx error entries can include complete request lines and query strings.
# Use privacy-preserving access status/latency metrics for edge diagnostics.
error_log /dev/null crit;
pid /tmp/nginx.pid;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    # Never log query strings, cookies, request bodies, or authorization headers.
    log_format privacy '$time_iso8601 $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log privacy;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=6r/m;
    upstream medguard {
        least_conn;
        server app1:8000 max_fails=2 fail_timeout=10s;
        server app2:8000 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }
    server {
        listen 8080;
        # Host comes from explicit deployment configuration, never an untrusted redirect header.
        return 308 https://localhost:8443$request_uri;
    }
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        ssl_session_cache shared:TLS:10m;
        client_max_body_size 10m;
        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 30s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = /metrics { deny all; }
        location = /docs { deny all; }
        location = /redoc { deny all; }
        location = /openapi.json { deny all; }
        location = /v1/health/readiness { deny all; }
        location = /v1/health/circuit-status { deny all; }
        location ~ ^/v1/auth/(login|register)$ {
            limit_req zone=auth burst=12 nodelay;
            limit_req_status 429;
            include /etc/nginx/proxy-medguard.conf;
        }
        location / {
            include /etc/nginx/proxy-medguard.conf;
        }
    }
}
